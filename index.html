<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapMagic</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SnapMagic turns your photo into a festive photoshoot, 3D cartoon or greeting card. No typing, about 20 seconds.">
<meta name="theme-color" content="#0B0810">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* SnapMagic "dark premium": one phone-width column, step-by-step screens. */
:root{
  --bg:#0B0810; --surface:#16111D; --line:#2A2233; --goldline:#3A2E1E;
  --fg:#F6EFE3; --muted:#B3A795; --soft:#D8CDBC;
  --gold:#E0B25A; --gold-hi:#F2CF86; --gold-ink:#1E1405;
  --wa:#25D366; --wa-ink:#06351B;
  --display:"Bricolage Grotesque","Hind","Noto Sans Devanagari",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope","Hind","Noto Sans Devanagari",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh;
  background:radial-gradient(520px 320px at 50% -80px,rgba(224,178,90,.10),transparent 70%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
[hidden]{display:none!important}
svg{flex:none;display:block}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.app{max-width:440px;margin:0 auto;padding-block:20px 36px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.hdr-l,.hdr-r{display:flex;gap:8px;align-items:center}
.logo{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--gold)}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--goldline);color:var(--gold);white-space:nowrap}
.lang{font-weight:600;font-size:13px;padding:0 14px;min-height:44px;border-radius:999px;background:transparent;border:1px solid var(--line)}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.lang:hover,.round:hover{border-color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1;max-width:170px}
.steps i{height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--gold)}

.screen{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em;line-height:1.15}
.head{display:flex;flex-direction:column;gap:6px}
.sub{font-size:13px;color:var(--muted)}
:lang(hi) h1,:lang(hi) h2{letter-spacing:0;line-height:1.25}
:lang(hi) .eyebrow{letter-spacing:.04em}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:10px 16px;border:0;border-radius:16px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:16px;text-decoration:none;text-align:center;line-height:1.2;transition:transform .12s,background .15s}
.btn:hover:not(:disabled){background:var(--gold-hi)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn.big{min-height:58px;border-radius:18px;font-size:17px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:48px;border-radius:14px}
.btn.ghost:hover:not(:disabled){background:var(--surface);border-color:var(--gold)}
.btn.wa{background:var(--wa);color:var(--wa-ink);font-size:15px}
.btn.wa:hover{background:#3BE07A}
.btn.sm{font-size:15px}
.link{background:none;border:0;color:var(--gold);font-weight:700;font-size:14px;min-height:44px;padding:8px 10px;border-radius:10px;align-self:center}
.link:hover{color:var(--gold-hi)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:12px;color:var(--muted);text-align:center}

/* Hero */
.hero{border-radius:28px;padding:1px;background:linear-gradient(160deg,#6B5326,var(--line) 45%,var(--line))}
.hero-in{border-radius:27px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:16px}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:relative}
.ph{position:relative;height:220px;border-radius:18px;overflow:hidden;background:#201829}
.ph img{width:100%;height:112%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;font-weight:700;font-size:10px;letter-spacing:.12em;padding:5px 9px;border-radius:999px;line-height:1.3}
.tag.b{left:10px;background:rgba(11,8,16,.72);color:var(--fg)}
.tag.a{right:10px;background:var(--gold);color:var(--gold-ink)}
.arrow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--gold-ink);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center}
.hero h1{font-size:32px;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--gold);white-space:nowrap}
.hero p{font-size:14px;line-height:1.55;color:var(--muted)}
.hero .txt{display:flex;flex-direction:column;gap:8px}

/* Picture tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pic{position:relative;height:200px;padding:0;border:0;border-radius:22px;overflow:hidden;background:var(--surface);text-align:left;display:block;width:100%}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.pic:hover img{transform:scale(1.04)}
.pic .cap{position:absolute;inset:auto 0 0 0;padding:44px 12px 12px;background:linear-gradient(to top,rgba(11,8,16,.96) 32%,rgba(11,8,16,0));display:flex;flex-direction:column;gap:2px}
.pic b{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;color:var(--fg)}
.pic small{font-weight:600;font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:10px;left:10px;font-weight:700;font-size:10px;letter-spacing:.08em;padding:5px 9px;border-radius:999px;background:var(--gold);color:var(--gold-ink);line-height:1.3}
.badge.ivory{background:var(--fg);color:var(--bg)}
.pic::after{content:"";position:absolute;inset:0;border-radius:22px;border:1px solid rgba(246,239,227,.08);pointer-events:none}
.pic:focus-visible{outline-offset:3px}
.more{display:flex;flex-direction:column;gap:10px}
.more .sub{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
:lang(hi) .more .sub{letter-spacing:.03em}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:104px;padding:12px;border-radius:18px;border:1px solid var(--line);text-align:left;color:var(--fg);
  background:linear-gradient(150deg,rgba(224,178,90,.16),rgba(123,47,247,.10) 55%,rgba(22,17,29,1)) , var(--surface)}
.mini:hover{border-color:var(--gold)}
.mini .ico{width:34px;height:34px;border-radius:11px;background:rgba(11,8,16,.55);color:var(--gold);display:flex;align-items:center;justify-content:center}
.mini b{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.mini small{font-size:11px;font-weight:600;color:var(--muted);margin-top:-6px}

/* Look picker */
.lookhead{position:relative;border-radius:22px;overflow:hidden;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:16px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(224,178,90,.18),rgba(123,47,247,.12) 55%,var(--surface)),var(--surface)}
.lookhead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.lookhead::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(11,8,16,.96) 18%,rgba(11,8,16,.35))}
.lookhead>*:not(img){position:relative;z-index:2}
.look{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:62px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--fg)}
.look b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2}
.look svg{color:var(--muted)}
.look:hover{border-color:var(--gold)}
.look:hover svg{color:var(--gold)}
.look.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.look.sel svg{color:var(--gold)}

/* Upload */
.drop{border:1.5px dashed #453a55;border-radius:22px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(22,17,29,.6)}
.drop .ico{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--goldline);color:var(--gold);display:flex;align-items:center;justify-content:center}
.drop img{width:124px;height:124px;object-fit:cover;border-radius:50%;border:2px solid var(--gold)}
.drop b{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25}
.drop small{color:var(--muted);font-size:13px}
.drop label.btn{width:auto;min-height:46px;padding:8px 18px;cursor:pointer;margin-top:4px;color:var(--gold);border-color:var(--gold)}
.vh:focus-visible+label{outline:2px solid var(--fg);outline-offset:2px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair .drop{padding:18px 8px}
.pair .drop img{width:88px;height:88px}
.pair .drop .ico{width:48px;height:48px}
.pair .drop label.btn{padding:8px 12px;font-size:13px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--soft);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tip svg{color:var(--gold);margin-top:2px}
.tip.plain{background:none;border:0;padding:0 2px;color:var(--muted);font-size:12px}
.tip.plain svg{color:var(--muted)}

/* Style cards */
.style{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 6px 12px;border-radius:22px;background:var(--surface);border:2px solid var(--line);text-align:left;color:var(--fg)}
.style .ph{display:block;height:190px;border-radius:16px;margin-bottom:2px}
.style b{font-family:var(--display);font-weight:700;font-size:16px;padding:0 6px;line-height:1.2}
.style small{font-weight:600;font-size:11px;color:var(--muted);padding:0 6px}
.style small.pop{color:var(--gold);font-weight:700}
.style:hover{border-color:#5a4a2c}
.style.sel{border-color:var(--gold)}
.style .tick{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:none;align-items:center;justify-content:center}
.style.sel .tick{display:flex}
.ready{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ready img,.ready .ico{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.ready .ico{background:var(--bg);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center}
.ready div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ready b{font-size:14px;font-weight:700;line-height:1.3}
.ready small{font-size:12px;color:var(--muted);line-height:1.35}
.ready .link{font-size:13px}
.cta{display:flex;flex-direction:column;gap:10px}

/* Result */
.okline{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:#8FE0B0}
.frame{border-radius:26px;overflow:hidden;border:1px solid var(--goldline);background:var(--surface)}
img.result{width:100%;display:block;min-height:120px}
.cardbox{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.cardbox>b{font-family:var(--display);font-weight:700;font-size:16px}
.cardbox label{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:16px}
.row input::placeholder{color:#7d7287;font-weight:500}
.row input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.row button{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;font-size:14px}
.row button:hover{background:rgba(224,178,90,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-weight:600;font-size:13px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg)}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}

/* Loading, error, limit */
.loading{text-align:center;padding:72px 0 60px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.loading b{font-family:var(--display);font-weight:800;font-size:24px;color:var(--fg);letter-spacing:-.02em}
.spin{width:52px;height:52px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin-bottom:14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#2A1219;border:1px solid #6E2A3A;border-radius:14px;padding:14px;color:#FFD6DE;font-size:14px}
.msg{display:flex;flex-direction:column;gap:14px;padding:28px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--goldline);text-align:center;align-items:center}
.msg .ico{width:56px;height:56px;border-radius:50%;background:var(--bg);border:1px solid var(--goldline);color:var(--gold);display:flex;align-items:center;justify-content:center}
.msg h1{font-size:25px}
.msg p{color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:0 8px}

.screen>*{animation:rise .28s ease backwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .pic:hover img{transform:none}
}
@media (max-width:359px){
  h1{font-size:26px}.hero h1{font-size:27px}.ph{height:190px}.pic{height:176px}.style .ph{height:160px}
  .logo{font-size:22px}.mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:700px){.app{padding-block:32px 48px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hdr-l">
      <button class="round" id="back" hidden></button>
      <div class="logo" id="logo">Snap<span>Magic</span></div>
    </div>
    <div class="steps" id="steps" role="img" hidden><i></i><i></i><i></i><i></i></div>
    <div class="hdr-r">
      <span class="pill" id="pill"></span>
      <button class="lang" id="lang" aria-label="Change language">हिंदी</button>
    </div>
  </header>
  <main id="screen" class="screen"></main>
  <p class="foot" id="foot"></p>
</div>

<script>

// Home screen pictures: [file, crop position, short line EN, short line HI, badge]

 Couple:["06-couple-wedding","50% 20%","Wedding · Romantic","शादी · रोमांटिक"],

 "Profile Pic":["11-profile-insta","50% 20%","WhatsApp · Instagram DP","व्हाट्सएप · इंस्टाग्राम DP"]
};

const STYLE_PICS={"3D Cartoon":["03-diwali-cartoon","50% 0%"],Realistic:["02-diwali-realistic","55% 0%"],Painting:["04-diwali-painting","55% 0%"],Anime:["05-diwali-anime","50% 0%"]};
const pic=f=>`samples/${f}.jpg`;

// Hindi names for categories, looks and styles (English is the key).
const HI={Couple:"कपल",Boys:"लड़के",Girls:"लड़कियाँ",Kids:"बच्चे",Festival:"त्योहार",Group:"परिवार और ग्रुप","Profile Pic":"प्रोफाइल फोटो",Product:"प्रोडक्ट","White background":"सफ़ेद बैकग्राउंड","Studio shot":"स्टूडियो शॉट","Lifestyle scene":"लाइफस्टाइल सीन","Diwali offer":"दिवाली ऑफर","Instagram post":"इंस्टाग्राम पोस्ट","Nature outdoor":"नेचर / आउटडोर",Professional:"प्रोफेशनल",Lifestyle:"लाइफस्टाइल",Fantasy:"फैंटेसी",
 Romantic:"रोमांटिक",Wedding:"शादी",Cinematic:"सिनेमैटिक",Stylish:"स्टाइलिश",Gym:"जिम",Luxury:"लग्ज़री",Fashion:"फैशन",Traditional:"ट्रेडिशनल",Portrait:"पोर्ट्रेट",
 "Birthday party":"बर्थडे पार्टी","Little superhero":"नन्हा सुपरहीरो",Astronaut:"अंतरिक्ष यात्री","Cricket star":"क्रिकेट स्टार","Little prince/princess":"नन्हा राजकुमार/राजकुमारी","Cartoon world":"कार्टून दुनिया",
 Diwali:"दिवाली",Holi:"होली",Eid:"ईद","Raksha Bandhan":"रक्षाबंधन",Navratri:"नवरात्रि","Ganesh Chaturthi":"गणेश चतुर्थी","Independence Day":"स्वतंत्रता दिवस",Christmas:"क्रिसमस",Birthday:"जन्मदिन",

// Header: logo + free pill on home/result, back + progress on the steps in between.
function hdr(){
  document.documentElement.lang=lang==='hi'?'hi':'en';
  const mid=st.step>=1&&st.step<=3;
  $('lang').textContent=t('langBtn');$('lang').setAttribute('aria-label',t('langAria'));
  $('foot').textContent=t('foot');
  $('back').hidden=!mid;$('back').innerHTML=ic('back');$('back').setAttribute('aria-label',t('back'));
  $('logo').hidden=mid;$('pill').hidden=mid;$('steps').hidden=!mid;
  $('pill').innerHTML=`${STAR}<span aria-hidden="true">${left()} ${t('free')}</span><span class="vh">${left()} ${t('left')}</span>`;
  [...$('steps').children].forEach((el,i)=>el.classList.toggle('on',i<=Math.min(st.step,3)));
  $('steps').setAttribute('aria-label',mid?t('step'+(st.step===2?'3req':st.step+1)):'');
}

    s.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{st.cat=b.dataset.v;st.opt=null;st.step=1;render();window.scrollTo(0,0)});

    <button class="btn" id="next" ${prod&&!has?'disabled':''}>${has||prod?t('next'):t('skip')}${has?ic('arrow',18,2.4):''}</button>`;
    $('file').onchange=e=>{const f=e.target.files[0];if(f)readFile(f,d=>{st.photo=d;render()})};
    if($('file2'))$('file2').onchange=e=>{const f=e.target.files[0];if(f)readFile(f,d=>{st.photo2=d;render()})};

    $('next').onclick=()=>{if(prod&&!has)return;if(!st.style)st.style='3D Cartoon';st.step=3;render();window.scrollTo(0,0)};

  }else{
    generate();
  }

// with a stronger lift for dark photos.
async function shrink(dataUrl){
  return new Promise(res=>{const im=new Image();im.onload=()=>{const m=1024,r=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    try{
      const d=x.getImageData(0,0,c.width,c.height),p=d.data;
      // brightness histogram (whole photo) + average of the middle area (face)
      const hist=new Uint32Array(256);let fs=0,fn=0;
      const x0=c.width*0.25,x1=c.width*0.75,y0=c.height*0.15,y1=c.height*0.65;
      for(let i=0,k=0;i<p.length;i+=4,k++){const l=(0.299*p[i]+0.587*p[i+1]+0.114*p[i+2])|0;hist[l]++;
        const xx=k%c.width,yy=(k/c.width)|0;if(xx>x0&&xx<x1&&yy>y0&&yy<y1){fs+=l;fn++}}
      const total=c.width*c.height;let acc=0,lo=0,hi=255;
      for(let v=0;v<256;v++){acc+=hist[v];if(acc>total*0.01){lo=v;break}}
      acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>total*0.01){hi=v;break}}
      if(hi-lo<40){lo=0;hi=255}
      const face=fn?fs/fn:128;
      // target face brightness ~145; never darken, max strong lift for dark photos
      const g=face<145?Math.max(0.55,Math.min(1,Math.log(145/255)/Math.log(Math.max(face,8)/255))):1;
      const lut=new Uint8ClampedArray(256);
      for(let v=0;v<256;v++){let t=Math.min(1,Math.max(0,(v-lo)/Math.max(1,hi-lo)));t=Math.pow(t,g);lut[v]=Math.round(255*t)}
      const sat=1.08;
      for(let i=0;i<p.length;i+=4){
        let R=lut[p[i]],G=lut[p[i+1]],B=lut[p[i+2]];const L=0.299*R+0.587*G+0.114*B;
        p[i]=L+(R-L)*sat;p[i+1]=L+(G-L)*sat;p[i+2]=L+(B-L)*sat;
      }
      x.putImageData(d,0,0);
    }catch(e){}
    res(c.toDataURL('image/jpeg',0.92))};im.onerror=()=>res(null);im.src=dataUrl});
}
const APP_URL='snapmagic-inky.vercel.app';
// Adds a small app-name label to a corner of the picture.
const LABEL='✨ Made with SnapMagic';
function addLabel(src,top){
  return new Promise(res=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');
    x.drawImage(im,0,0);
    const f=Math.max(14,Math.round(im.width*0.026)),pad=Math.round(f*0.7);
    x.font=`700 ${f}px Manrope,system-ui,sans-serif`;
    const bw=x.measureText(LABEL).width+pad*2,bh=f+pad*1.4,bx=im.width-bw-pad,by=top?pad:im.height-bh-pad;
    x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.roundRect?x.roundRect(bx,by,bw,bh,f*0.6):x.rect(bx,by,bw,bh);x.fill();
    x.fillStyle='#fff';x.textBaseline='middle';x.fillText(LABEL,bx+pad,by+bh/2);
    res(c.toDataURL('image/jpeg',0.92));
  };im.onerror=()=>res(src);im.src=src});
}
const WISHES={
 Diwali:['Happy Diwali','शुभ दीपावली'],'Diwali offer':['Happy Diwali','शुभ दीपावली'],'Family Diwali':['Happy Diwali','शुभ दीपावली'],Holi:['Happy Holi','होली की शुभकामनाएं'],Eid:['Eid Mubarak','ईद मुबारक'],
 'Raksha Bandhan':['Happy Raksha Bandhan','रक्षाबंधन की शुभकामनाएं'],Navratri:['Happy Navratri','नवरात्रि की शुभकामनाएं'],'Ganesh Chaturthi':['Ganpati Bappa Morya','गणपति बप्पा मोरया'],
 'Independence Day':['Happy Independence Day','स्वतंत्रता दिवस की शुभकामनाएं'],Christmas:['Merry Christmas','मेरी क्रिसमस'],Birthday:['Happy Birthday','जन्मदिन मुबारक'],'Birthday party':['Happy Birthday','जन्मदिन मुबारक']};
const isBday=o=>o==='Birthday'||o==='Birthday party';
const CARD_FONT='"Bricolage Grotesque","Hind",system-ui,sans-serif',CARD_FONT2='Manrope,"Hind",system-ui,sans-serif';
// Draws the wish and name on the picture, like a greeting card.
// hi = the wish is the Hindi one, so the "from" line is written in Hindi too.
async function makeCard(src,wish,name,bday,hi){
  try{await Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'),document.fonts.load('700 40px Hind','अ')])}catch(e){}
  return new Promise(res=>{const im=new Image();im.onload=()=>{
    const W=im.width,H=im.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.drawImage(im,0,0);
    const g=x.createLinearGradient(0,H*0.62,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.45,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,.8)');
    x.fillStyle=g;x.fillRect(0,H*0.62,W,H*0.38);
    x.textAlign='center';x.textBaseline='alphabetic';
    let line1=wish,line2='';
    if(name){name=name.replace(/^\s*from\s+/i,'').replace(/\s*की ओर से\s*$/,'').trim();}
    if(name){line2=bday?name:(hi?name+' की ओर से':'from '+name);if(bday)line1=wish+',';}
    let f1=Math.round(W*0.085);x.font=`800 ${f1}px ${CARD_FONT}`;
    while(x.measureText(line1).width>W*0.9&&f1>12){f1-=2;x.font=`800 ${f1}px ${CARD_FONT}`}
    const f2=Math.round(f1*0.55);
    const y2=H-Math.round(H*0.05),y1=line2?y2-f2*1.5:y2;
    x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=f1*0.2;
    x.fillStyle='#ffd27a';x.fillText(line1,W/2,y1);
    if(line2){x.font=`700 ${f2}px ${CARD_FONT2}`;let tt=line2;while(x.measureText(tt).width>W*0.9&&tt.length>4)tt=tt.slice(0,-2);x.fillStyle='#fff';x.fillText(tt,W/2,y2)}
    res(c.toDataURL('image/jpeg',0.92));
  };im.onerror=()=>res(src);im.src=src});
}
async function toFile(dataUrl){const b=await (await fetch(dataUrl)).blob();return new File([b],'snapmagic.jpg',{type:'image/jpeg'})}
// Save: on phones open the share sheet so "Save Image" puts it in the Photos gallery.
async function saveImage(dataUrl){
  try{
    const file=await toFile(dataUrl);
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=dataUrl;a.download='snapmagic.jpg';document.body.appendChild(a);a.click();a.remove();
}
async function shareImage(dataUrl){
  const text=t('shareText')+'https://'+APP_URL;
  try{
    const file=await toFile(dataUrl);
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  // Fallback: open WhatsApp with the message; user attaches the saved image.
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function limitScreen(msg){
  st.view=msg?'cap':'limit';hdr();
  $('screen').innerHTML=`<div class="msg"><span class="ico">${ic(msg?'clock':'gift',26,2)}</span><h1>${msg?t('dailyCap'):t('limitTitle')}</h1>${msg?'':`<p>${t('limitText')}</p>`}
  <button class="btn ghost" id="again">${t('over')}</button></div>`;
  $('again').onclick=reset;
}
function errorScreen(){
  st.view='error';hdr();
  $('screen').innerHTML=`<div class="head"><h1>${t('fail')}</h1></div><div class="err" id="msg" role="alert"></div>
  <button class="btn" id="same">${t('tryAgain')}</button><button class="link" id="again">${t('over')}</button>`;
  $('msg').textContent=lang==='hi'?t('err'):(st.errMsg||t('err'));
  $('again').onclick=reset;
  $('same').onclick=()=>{st.style=null;st.step=3;render()};
}
// Redraws the picture with the chosen wish (or none) and name.
async function applyCard(){
  const r=st.res,w=WISHES[st.opt],n=++r.tok;
  const src=r.wi<0||!w?r.plain:await addLabel(await makeCard(r.base,w[r.wi],r.name,isBday(st.opt),r.wi===1),true);
  if(st.res!==r||n!==r.tok)return;
  r.cur=src;const o=$('out');if(o)o.src=src;
}
function resultScreen(){
  st.view='result';hdr();
  const r=st.res,w=WISHES[st.opt],prod=st.cat==='Product',bd=isBday(st.opt);
  $('screen').innerHTML=`<div class="head"><span class="okline">${ic('check',14,2.6)}${t('done')}</span><h1>${esc(nm(st.opt))} · ${esc(nm(st.style))}</h1></div>
  <div class="frame"><img class="result" id="out" alt="${esc(nm(st.opt))} · ${esc(nm(st.style))}"></div>
  <div class="two">
    <button class="btn wa" id="share" aria-label="${t('share')}">${ic('share')}${t('wa')}</button>
    <button class="btn sm" id="save">${ic('down')}${t('save')}</button>
  </div>
  <p class="note">${t('hold')}</p>
  ${w?`<form class="cardbox" id="cardform">
    <b>${t('cardTitle')}</b>
    <label for="cardname">${prod?t('shopName'):bd?t('bdayName'):t('yourName')}</label>
    <div class="row"><input id="cardname" maxlength="32" autocomplete="off" value="${esc(r.draft)}" placeholder="${prod?t('egShop'):bd?t('egBday'):t('egName')}"><button type="submit" id="mkcard">${t('update')}</button></div>
    <div class="chips" id="wishes">
      <button type="button" class="chip" data-w="0" lang="en">${esc(w[0])}</button>
      <button type="button" class="chip" data-w="1" lang="hi">${esc(w[1])}</button>
      <button type="button" class="chip" data-w="-1">${t('noText')}</button>
    </div>
  </form>`:''}
  <div class="two">
    <button class="btn ghost" id="regen">${t('regen')}</button>
    <button class="btn ghost" id="same">${t('diff')}</button>
  </div>
  <button class="link" id="again">${t('over')}</button>`;
  $('out').src=r.cur;
  $('save').onclick=()=>saveImage(r.cur);
  $('share').onclick=()=>shareImage(r.cur);
  $('regen').onclick=()=>generate();
  $('again').onclick=reset;
  $('same').onclick=()=>{st.style=null;st.step=3;render();window.scrollTo(0,0)};
  if(w){
    const chips=[...document.querySelectorAll('#wishes .chip')];
    const mark=()=>chips.forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.w===r.wi)));
    const read=()=>{r.draft=$('cardname').value;r.name=r.draft.trim()};
    mark();
    $('cardname').oninput=()=>{r.draft=$('cardname').value};
    chips.forEach(c=>c.onclick=()=>{read();r.wi=+c.dataset.w;mark();applyCard()});
    // Update: puts the name on the card (and adds the wish if none is chosen yet).
    $('cardform').onsubmit=e=>{e.preventDefault();read();if(r.wi<0)r.wi=L();mark();applyCard()};
  }
}
async function generate(){
  const s=$('screen');
  if(left()<=0)return limitScreen(false);
  st.view='loading';st.res=null;st.errMsg='';hdr();
  s.innerHTML=`<div class="loading" role="status"><div class="spin"></div><b id="ld1">${t('creating')}</b><span id="ld2">${t('wait')}</span></div>`;
  window.scrollTo(0,0);
  try{
    const photo=st.photo?await shrink(st.photo):null;
    const photo2=st.cat==='Couple'&&st.photo2?await shrink(st.photo2):null;
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cat:st.cat,opt:st.opt,style:st.style,photo:photo||photo2,photo2:photo&&photo2?photo2:null})});
    const j=await r.json().catch(()=>({}));
    if(r.status===429)return limitScreen(true);
    if(!r.ok||!j.image){st.errMsg=j.error||'';throw new Error(st.errMsg)}
    addUsed();
    const plain=await addLabel(j.image);
    st.res={base:j.image,plain,cur:plain,wi:-1,name:'',draft:'',tok:0};
    resultScreen();
  }catch(e){
    errorScreen();
  }
}
$('back').onclick=()=>{st.step=Math.max(0,st.step-1);render();window.scrollTo(0,0)};
$('lang').onclick=()=>{
  lang=lang==='hi'?'en':'hi';try{localStorage.setItem('sm_lang',lang)}catch(e){}
  if(st.step<4)return render();
  // Step 4: keep the picture, only redraw the words around it.
  if(st.view==='result')resultScreen();
  else if(st.view==='error')errorScreen();
  else if(st.view==='limit'||st.view==='cap')limitScreen(st.view==='cap');
  else{hdr();if($('ld1')){$('ld1').textContent=t('creating');$('ld2').textContent=t('wait')}}
};
render();
</script>
