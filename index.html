<title>SnapMagic</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width app column, step-by-step screens with a progress strip on top */
:root{
  --bg:#1a1426; --panel:#251c36; --line:#3a2e52; --fg:#f4eefb; --muted:#b4a7c9;
  --accent:#ffb238; --accent-ink:#2a1a00;
  --display:"Bricolage Grotesque","Hind",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope","Hind",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.back{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 14px;font:600 13px var(--body);cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps i{height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steplabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:left;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;min-height:92px}
.tile b{font-family:var(--display);font-size:18px;font-weight:600}
.tile small{color:var(--muted);font-size:12.5px}
.tile .sw{height:6px;width:40px;border-radius:6px;margin-bottom:6px}
.tile:hover,.tile:focus-visible{border-color:var(--accent);outline:none}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.drop{border:2px dashed var(--line);border-radius:18px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.drop img{width:120px;height:120px;object-fit:cover;border-radius:50%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .drop{padding:18px 10px}
.pair .drop img{width:88px;height:88px}
.banner{display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;border:0;border-radius:18px;padding:16px;color:#2a1200;background:linear-gradient(120deg,#ffb238,#ff7a3d 60%,#e52e71);font:inherit}
.banner span.em{font-size:34px;line-height:1}
.banner b{display:block;font-family:var(--display);font-size:19px;line-height:1.15}
.banner small{display:block;font-size:13px;opacity:.85;margin-top:2px}
.banner:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.hdr-r{display:flex;gap:8px;align-items:center}
.tip{font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:15px;font:700 16px var(--body);cursor:pointer;width:100%}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible,.back:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
div.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
input#cardname{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:600 15px var(--body)}
input#cardname:focus{outline:2px solid var(--accent)}
button.wa{background:#25d366;color:#06351b}
img.result{width:100%;max-width:100%;border-radius:18px;display:block;background:var(--panel)}
.err{background:#3a1a24;border:1px solid #7a2a3c;border-radius:14px;padding:14px;color:#ffd6de}
a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:700;font-size:13px}
details p{font-size:13px;color:var(--muted);margin:8px 0 0}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
</style>

<div class="app">
  <header>
    <div class="logo">Snap<span>Magic</span></div>
    <div class="hdr-r">
      <button class="back" id="lang" aria-label="Change language">हिंदी</button>
      <button class="back" id="back" hidden>Back</button>
    </div>
  </header>
  <div class="steps" id="steps"><i></i><i></i><i></i><i></i><i></i></div>
  <main id="screen"></main>
  <p class="note" id="foot"></p>
</div>

<script>
const CATS={

 "Profile Pic":{c:["#7b2ff7","#ff7ac6"],opts:["WhatsApp DP","Instagram DP","LinkedIn photo","Cool avatar"]},
 Professional:{c:["#3a7bd5","#9aa8bd"],opts:["Business","LinkedIn","Office"]},
 Lifestyle:{c:["#ffb238","#ff5e3a"],opts:["Luxury car","Travel","Rich lifestyle"]},
 Fantasy:{c:["#7b2ff7","#00d4ff"],opts:["Anime","Superhero","Fantasy"]}
};
const STYLES={"3D Cartoon":["Most popular ⭐","सबसे लोकप्रिय ⭐"],Realistic:["Pro photoshoot look","प्रो फोटोशूट लुक"],Painting:["Oil painting look","ऑयल पेंटिंग लुक"],Anime:["Japanese anime look","जापानी एनीमे लुक"]};

// Hindi names for categories, looks and styles (English is the key).
const HI={Couple:"कपल",Boys:"लड़के",Girls:"लड़कियाँ",Kids:"बच्चे",Festival:"त्योहार",Group:"ग्रुप / परिवार","Profile Pic":"प्रोफाइल फोटो",Product:"प्रोडक्ट","White background":"सफ़ेद बैकग्राउंड","Studio shot":"स्टूडियो शॉट","Lifestyle scene":"लाइफस्टाइल सीन","Diwali offer":"दिवाली ऑफर","Instagram post":"इंस्टाग्राम पोस्ट","Nature outdoor":"नेचर / आउटडोर",Professional:"प्रोफेशनल",Lifestyle:"लाइफस्टाइल",Fantasy:"फैंटेसी",
 Romantic:"रोमांटिक",Wedding:"शादी",Cinematic:"सिनेमैटिक",Stylish:"स्टाइलिश",Gym:"जिम",Luxury:"लग्ज़री",Fashion:"फैशन",Traditional:"ट्रेडिशनल",Portrait:"पोर्ट्रेट",
 "Birthday party":"बर्थडे पार्टी","Little superhero":"नन्हा सुपरहीरो",Astronaut:"अंतरिक्ष यात्री","Cricket star":"क्रिकेट स्टार","Little prince/princess":"नन्हा राजकुमार/राजकुमारी","Cartoon world":"कार्टून दुनिया",
 Diwali:"दिवाली",Holi:"होली",Eid:"ईद","Raksha Bandhan":"रक्षाबंधन",Navratri:"नवरात्रि","Ganesh Chaturthi":"गणेश चतुर्थी","Independence Day":"स्वतंत्रता दिवस",Christmas:"क्रिसमस",Birthday:"जन्मदिन",
 "Family portrait":"फैमिली फोटो","Family Diwali":"फैमिली दिवाली","Friends trip":"दोस्तों की ट्रिप","Office team":"ऑफिस टीम",Party:"पार्टी","Movie poster":"मूवी पोस्टर",
 "WhatsApp DP":"व्हाट्सएप DP","Instagram DP":"इंस्टाग्राम DP","LinkedIn photo":"लिंक्डइन फोटो","Cool avatar":"कूल अवतार",
 Business:"बिज़नेस",LinkedIn:"लिंक्डइन",Office:"ऑफिस","Luxury car":"लग्ज़री कार",Travel:"ट्रैवल","Rich lifestyle":"रिच लाइफस्टाइल",Anime:"एनीमे",Superhero:"सुपरहीरो",
 "3D Cartoon":"3D कार्टून",Realistic:"रियलिस्टिक",Painting:"पेंटिंग"};

const TXT={
 step1:["Step 1 of 4","स्टेप 1 / 4"],q:["What do you want to create?","आप क्या बनाना चाहते हैं?"],
 step2:["Step 2 of 4","स्टेप 2 / 4"],pick:["Pick a look","लुक चुनें"],tap:["Tap to choose","चुनने के लिए टैप करें"],
 step3:["Step 3 of 4 · Optional","स्टेप 3 / 4 · ज़रूरी नहीं"],
 addPhoto:["Add your photo","अपनी फोटो जोड़ें"],addChild:["Add your child's photo","बच्चे की फोटो जोड़ें"],addGroup:["Add your group photo","ग्रुप फोटो जोड़ें"],addCouple:["Add your photos","अपनी फोटो जोड़ें"],
 useFace:["Use your own face","अपना चेहरा इस्तेमाल करें"],skipNew:["Or skip, and AI will make a new person","या स्किप करें, AI नया चेहरा बनाएगा"],
 childFace:["Use a clear photo of the child","बच्चे की साफ़ फोटो लगाएं"],skipChild:["Or skip, and AI will make a cute new child","या स्किप करें, AI एक प्यारा बच्चा बनाएगा"],
 groupFace:["Use a photo of your family or friends","परिवार या दोस्तों की फोटो लगाएं"],skipGroup:["Or skip, and AI will make a new group","या स्किप करें, AI नया ग्रुप बनाएगा"],
 you:["You","आप"],partner:["Partner","पार्टनर"],
 upload:["Upload photo","फोटो अपलोड करें"],change:["Change photo","फोटो बदलें"],
 tipSolo:["💡 Best results: a clear, front-facing photo of just you, in good light.","💡 बेहतरीन रिज़ल्ट: अच्छी रोशनी में सिर्फ़ आपकी साफ़, सामने से ली गई फोटो।"],
 tipGroup:["💡 Works best with 2–6 people, with every face clearly visible.","💡 2–6 लोगों की फोटो सबसे अच्छी आती है, सबके चेहरे साफ़ दिखने चाहिए।"],
 tipCouple:["💡 Add one clear photo of each person, or just one photo of you both together.","💡 दोनों की एक-एक साफ़ फोटो लगाएं, या दोनों की एक साथ वाली एक फोटो।"],
 kidNote:["👶 Only upload a child's photo if you are their parent or have family permission.","👶 बच्चे की फोटो तभी लगाएं जब आप माता-पिता हों या परिवार की इजाज़त हो।"],
 next:["Next","आगे"],skip:["Skip","स्किप"],
 step4:["Step 4 of 4","स्टेप 4 / 4"],choose:["Choose a style","स्टाइल चुनें"],yourPhoto:["Your photo","आपकी फोटो"],noPhoto:["No photo","फोटो नहीं"],gen:["Generate","बनाएं"],
 creating:["Creating your image…","आपकी फोटो बन रही है…"],wait:["This takes about 10–20 seconds","इसमें 10–20 सेकंड लगते हैं"],
 done:["Done","तैयार"],cardTitle:["💌 Make it a greeting card","💌 ग्रीटिंग कार्ड बनाएं"],yourName:["Your name","आपका नाम"],bdayName:["Birthday person's name","जिसका जन्मदिन है, उसका नाम"],
 egName:["e.g. Javed & Family","जैसे: जावेद और परिवार"],egBday:["e.g. Aarav","जैसे: आरव"],addCard:["Add card","कार्ड जोड़ें"],update:["Update card","कार्ड बदलें"],
 share:["Share on WhatsApp","व्हाट्सएप पर शेयर करें"],save:["Save image","फोटो सेव करें"],hold:["On phone: you can also press and hold the image to save it.","फोन पर: फोटो को दबाकर रखें और सेव करें।"],
 regen:["🔄 Generate again","🔄 फिर से बनाएं"],diff:["Try a different style","दूसरा स्टाइल आज़माएं"],over:["Start over","शुरू से करें"],
 fail:["Couldn't make it","फोटो नहीं बन पाई"],tryAgain:["Try again","फिर कोशिश करें"],back:["Back","पीछे"],
 err:["Something went wrong. Please try again.","कुछ गड़बड़ हो गई। कृपया फिर कोशिश करें।"],
 foot:["Images are made by AI. Please only upload photos you have permission to use.","फोटो AI से बनती हैं। सिर्फ़ वही फोटो अपलोड करें जिनकी आपको इजाज़त है।"],
 shareText:["Look what I made with SnapMagic! ✨ Make yours free: ","देखो SnapMagic से मैंने क्या बनाया! ✨ आप भी फ्री में बनाओ: "],
 langBtn:["हिंदी","English"],
 addProduct:["Add your product photo","अपने प्रोडक्ट की फोटो जोड़ें"],productFace:["Use a clear photo of your product","अपने प्रोडक्ट की साफ़ फोटो लगाएं"],productNeed:["A product photo is needed for this","इसके लिए प्रोडक्ट की फोटो ज़रूरी है"],
 tipProduct:["💡 Best results: one product, fully visible, in good light. The AI keeps your product the same and changes only the background.","💡 बेहतरीन रिज़ल्ट: एक ही प्रोडक्ट, पूरा दिखता हुआ, अच्छी रोशनी में। AI आपका प्रोडक्ट वैसा ही रखेगा, सिर्फ़ बैकग्राउंड बदलेगा।"],
 shopName:["Your shop name","आपकी दुकान का नाम"],egShop:["e.g. Sharma Sweets","जैसे: शर्मा स्वीट्स"],
 banner:["Make your Diwali card in 1 tap","1 टैप में अपना दिवाली कार्ड बनाएं"],bannerSub:["Add your photo · get a Happy Diwali card to share","अपनी फोटो लगाएं · शेयर करने के लिए दिवाली कार्ड पाएं"],
 limitTitle:["You've used your free images 🎉","आपकी फ्री फोटो खत्म हो गईं 🎉"],
 limitText:["Thanks for trying SnapMagic! More images are coming soon with our app on the Play Store.","SnapMagic आज़माने के लिए धन्यवाद! जल्द ही Play Store पर ऐप के साथ और फोटो बना सकेंगे।"],
 dailyCap:["Today's free images are finished 🎆 Please come back tomorrow!","आज की फ्री फोटो खत्म हो गईं 🎆 कृपया कल फिर आएं!"],
 left:["free images left","फ्री फोटो बाकी"]
};
let lang='en';try{lang=localStorage.getItem('sm_lang')||'en'}catch(e){}
const L=()=>lang==='hi'?1:0;
const t=k=>TXT[k][L()];
const nm=k=>lang==='hi'&&HI[k]?HI[k]:k;

const FREE_LIMIT=2; // free images per phone
const used=()=>{try{return +localStorage.getItem('sm_used')||0}catch(e){return 0}};
const addUsed=()=>{try{localStorage.setItem('sm_used',used()+1)}catch(e){}};
if(location.hash==='#owner'){try{localStorage.removeItem('sm_used')}catch(e){}}
const left=()=>Math.max(0,FREE_LIMIT-used());
const st={step:0,cat:null,opt:null,photo:null,photo2:null,style:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tile(key,sub,sel,cols){return `<button class="tile${sel?' sel':''}" data-v="${esc(key)}">${cols?`<span class="sw" style="background:linear-gradient(90deg,${cols[0]},${cols[1]})"></span>`:''}<b>${esc(nm(key))}</b><small>${esc(sub)}</small></button>`}
function readFile(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function render(){
  document.documentElement.lang=lang==='hi'?'hi':'en';
  $('lang').textContent=t('langBtn');$('back').textContent=t('back');$('foot').textContent=t('foot');
  [...$('steps').children].forEach((el,i)=>el.classList.toggle('on',i<=Math.min(st.step,4)));
  $('back').hidden=st.step===0||st.step===4;
  const s=$('screen');
  if(st.step===0){
    s.innerHTML=`<div style="display:grid;gap:14px"><button class="banner" id="diwali"><span class="em">🪔</span><span><b>${t('banner')}</b><small>${t('bannerSub')}</small></span></button>
    <p class="steplabel">${t('step1')} · ${left()} ${t('left')}</p><h1>${t('q')}</h1><div class="grid">${Object.entries(CATS).map(([k,v])=>tile(k,v.opts.map(nm).join(' · '),false,v.c)).join('')}</div></div>`;
    s.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{st.cat=b.dataset.v;st.opt=null;st.step=1;render()});
    $('diwali').onclick=()=>{st.cat='Festival';st.opt='Diwali';st.step=2;render()};
  }else if(st.step===1){
    s.innerHTML=`<div style="display:grid;gap:14px"><p class="steplabel">${t('step2')} · ${esc(nm(st.cat))}</p><h1>${t('pick')}</h1><div class="grid">${CATS[st.cat].opts.map(k=>tile(k,t('tap'),st.opt===k,CATS[st.cat].c)).join('')}</div></div>`;
    s.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{st.opt=b.dataset.v;st.step=2;render()});
  }else if(st.step===2){
    const kids=st.cat==='Kids',group=st.cat==='Group',couple=st.cat==='Couple',prod=st.cat==='Product';
    const slot=(id,label,img)=>`<div class="drop">${img?`<img src="${img}" alt="">`:''}<b>${label}</b>
      <label class="btn ghost" for="${id}" style="width:auto;padding:10px 14px">${img?t('change'):t('upload')}</label>
      <input id="${id}" type="file" accept="image/*" hidden></div>`;
    let title,area,tip;
    if(couple){
      title=t('addCouple');tip=t('tipCouple');
      area=`<div class="pair">${slot('file',t('you'),st.photo)}${slot('file2',t('partner'),st.photo2)}</div>`;
    }else{
      title=prod?t('addProduct'):kids?t('addChild'):group?t('addGroup'):t('addPhoto');
      tip=prod?t('tipProduct'):group?t('tipGroup'):t('tipSolo');
      const [a,b]=prod?[t('productFace'),t('productNeed')]:kids?[t('childFace'),t('skipChild')]:group?[t('groupFace'),t('skipGroup')]:[t('useFace'),t('skipNew')];
      area=`<div class="drop">${st.photo?`<img src="${st.photo}" alt="">`:`<b>${a}</b><small style="color:var(--muted)">${b}</small>`}
      <label class="btn ghost" for="file" style="width:auto;padding:10px 18px">${st.photo?t('change'):t('upload')}</label>
      <input id="file" type="file" accept="image/*" hidden></div>`;
    }
    const has=st.photo||st.photo2;
    s.innerHTML=`<div style="display:grid;gap:14px"><p class="steplabel">${t('step3')}</p><h1>${title}</h1>${area}
    <p class="tip">${tip}</p>
    ${kids?`<p class="note" style="text-align:left">${t('kidNote')}</p>`:''}
    <button class="btn" id="next" ${prod&&!has?'disabled style="opacity:.45"':''}>${has?t('next'):t('skip')}</button></div>`;
    $('file').onchange=e=>{const f=e.target.files[0];if(f)readFile(f,d=>{st.photo=d;render()})};
    if($('file2'))$('file2').onchange=e=>{const f=e.target.files[0];if(f)readFile(f,d=>{st.photo2=d;render()})};
    $('next').onclick=()=>{if(prod&&!has)return;st.step=3;render()};
  }else if(st.step===3){
    const has=st.photo||st.photo2;
    s.innerHTML=`<div style="display:grid;gap:14px"><p class="steplabel">${t('step4')}</p><h1>${t('choose')}</h1><div class="grid">${Object.keys(STYLES).map(k=>tile(k,STYLES[k][L()],st.style===k)).join('')}</div>
    <div class="chips"><span class="chip">${esc(nm(st.cat))}</span><span class="chip">${esc(nm(st.opt))}</span><span class="chip">${has?t('yourPhoto'):t('noPhoto')}</span></div>
    <button class="btn" id="gen" ${st.style?'':'disabled style="opacity:.45"'}>${t('gen')}</button></div>`;
    s.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{st.style=b.dataset.v;render()});
    $('gen').onclick=()=>{if(!st.style)return;st.step=4;render()};
  }else{
    generate();
  }
}
// Makes the photo smaller and brightens it if it is too dark, so faces come out well lit.
async function shrink(dataUrl){
  return new Promise(res=>{const im=new Image();im.onload=()=>{const m=1024,r=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    try{
      const d=x.getImageData(0,0,c.width,c.height),p=d.data;
      // average brightness, measured on the middle of the photo (where the face usually is)
      let sum=0,n=0;const x0=Math.floor(c.width*0.25),x1=Math.floor(c.width*0.75),y0=Math.floor(c.height*0.15),y1=Math.floor(c.height*0.65);
      for(let y=y0;y<y1;y+=4)for(let xx=x0;xx<x1;xx+=4){const i=(y*c.width+xx)*4;sum+=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];n++}
      const mean=n?sum/n:128;
      if(mean<120){
        const g=Math.max(0.5,Math.min(1,Math.log(135/255)/Math.log(Math.max(mean,8)/255)));
        const lut=new Uint8ClampedArray(256);for(let v=0;v<256;v++)lut[v]=255*Math.pow(v/255,g);
        for(let i=0;i<p.length;i+=4){p[i]=lut[p[i]];p[i+1]=lut[p[i+1]];p[i+2]=lut[p[i+2]]}
        x.putImageData(d,0,0);
      }
    }catch(e){}
    res(c.toDataURL('image/jpeg',0.9))};im.onerror=()=>res(null);im.src=dataUrl});
}
const APP_URL='snapmagic-inky.vercel.app';
// Adds a small app-name label to a corner of the picture.
const LABEL='✨ Made with SnapMagic';
function addLabel(src,top){
  return new Promise(res=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');
    x.drawImage(im,0,0);
    const f=Math.max(14,Math.round(im.width*0.026)),pad=Math.round(f*0.7);
    x.font=`700 ${f}px Manrope,system-ui,sans-serif`;
    const bw=x.measureText(LABEL).width+pad*2,bh=f+pad*1.4,bx=im.width-bw-pad,by=top?pad:im.height-bh-pad;
    x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.roundRect?x.roundRect(bx,by,bw,bh,f*0.6):x.rect(bx,by,bw,bh);x.fill();
    x.fillStyle='#fff';x.textBaseline='middle';x.fillText(LABEL,bx+pad,by+bh/2);
    res(c.toDataURL('image/jpeg',0.92));
  };im.onerror=()=>res(src);im.src=src});
}
const WISHES={
 Diwali:['Happy Diwali','शुभ दीपावली'],'Diwali offer':['Happy Diwali','शुभ दीपावली'],'Family Diwali':['Happy Diwali','शुभ दीपावली'],Holi:['Happy Holi','होली की शुभकामनाएं'],Eid:['Eid Mubarak','ईद मुबारक'],
 'Raksha Bandhan':['Happy Raksha Bandhan','रक्षाबंधन की शुभकामनाएं'],Navratri:['Happy Navratri','नवरात्रि की शुभकामनाएं'],'Ganesh Chaturthi':['Ganpati Bappa Morya','गणपति बप्पा मोरया'],
 'Independence Day':['Happy Independence Day','स्वतंत्रता दिवस की शुभकामनाएं'],Christmas:['Merry Christmas','मेरी क्रिसमस'],Birthday:['Happy Birthday','जन्मदिन मुबारक'],'Birthday party':['Happy Birthday','जन्मदिन मुबारक']};
const isBday=o=>o==='Birthday'||o==='Birthday party';
const CARD_FONT='"Bricolage Grotesque","Hind",system-ui,sans-serif',CARD_FONT2='Manrope,"Hind",system-ui,sans-serif';
// Draws the wish and name on the picture, like a greeting card.
async function makeCard(src,wish,name,bday){
  try{await Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'),document.fonts.load('700 40px Hind','अ')])}catch(e){}
  return new Promise(res=>{const im=new Image();im.onload=()=>{
    const W=im.width,H=im.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.drawImage(im,0,0);
    const g=x.createLinearGradient(0,H*0.62,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.45,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,.8)');
    x.fillStyle=g;x.fillRect(0,H*0.62,W,H*0.38);
    x.textAlign='center';x.textBaseline='alphabetic';
    let line1=wish,line2='';
    if(name){line2=bday?name:(lang==='hi'?name+' की ओर से':'from '+name);if(bday)line1=wish+',';}
    let f1=Math.round(W*0.085);x.font=`800 ${f1}px ${CARD_FONT}`;
    while(x.measureText(line1).width>W*0.9&&f1>12){f1-=2;x.font=`800 ${f1}px ${CARD_FONT}`}
    const f2=Math.round(f1*0.55);
    const y2=H-Math.round(H*0.05),y1=line2?y2-f2*1.5:y2;
    x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=f1*0.2;
    x.fillStyle='#ffd27a';x.fillText(line1,W/2,y1);
    if(line2){x.font=`700 ${f2}px ${CARD_FONT2}`;let tt=line2;while(x.measureText(tt).width>W*0.9&&tt.length>4)tt=tt.slice(0,-2);x.fillStyle='#fff';x.fillText(tt,W/2,y2)}
    res(c.toDataURL('image/jpeg',0.92));
  };im.onerror=()=>res(src);im.src=src});
}
async function toFile(dataUrl){const b=await (await fetch(dataUrl)).blob();return new File([b],'snapmagic.jpg',{type:'image/jpeg'})}
async function shareImage(dataUrl){
  const text=t('shareText')+'https://'+APP_URL;
  try{
    const file=await toFile(dataUrl);
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  // Fallback: open WhatsApp with the message; user attaches the saved image.
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function limitScreen(msg){
  const s=$('screen');$('back').hidden=true;
  s.innerHTML=`<div style="display:grid;gap:14px"><h1>${msg?t('dailyCap'):t('limitTitle')}</h1>${msg?'':`<p style="margin:0;color:var(--muted)">${t('limitText')}</p>`}
  <button class="btn ghost" id="again">${t('over')}</button></div>`;
  $('again').onclick=()=>{Object.assign(st,{step:0,cat:null,opt:null,style:null,photo:null,photo2:null});render()};
}
async function generate(){
  const s=$('screen');
  if(left()<=0)return limitScreen(false);
  $('back').hidden=true;
  s.innerHTML=`<div class="loading"><div class="spin"></div>${t('creating')}<br><small>${t('wait')}</small></div>`;
  try{
    const photo=st.photo?await shrink(st.photo):null;
    const photo2=st.cat==='Couple'&&st.photo2?await shrink(st.photo2):null;
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cat:st.cat,opt:st.opt,style:st.style,photo:photo||photo2,photo2:photo&&photo2?photo2:null})});
    const j=await r.json().catch(()=>({}));
    if(r.status===429)return limitScreen(true);
    if(!r.ok||!j.image)throw new Error(lang==='hi'?t('err'):(j.error||t('err')));
    addUsed();
    const base=j.image;let cur=await addLabel(base);
    const w=WISHES[st.opt],wish=w&&w[L()];
    s.innerHTML=`<div style="display:grid;gap:14px"><p class="steplabel">${t('done')}</p><h1>${esc(nm(st.opt))} · ${esc(nm(st.style))}</h1>
    <img class="result" id="out" alt="">
    ${wish?`<div class="card">
      <b>${t('cardTitle')}</b>
      <label for="cardname" class="note" style="text-align:left">${st.cat==='Product'?t('shopName'):isBday(st.opt)?t('bdayName'):t('yourName')}</label>
      <input id="cardname" maxlength="32" placeholder="${st.cat==='Product'?t('egShop'):isBday(st.opt)?t('egBday'):t('egName')}">
      <button class="btn" id="mkcard">${t('addCard')}: "${wish}"</button>
    </div>`:''}
    <button class="btn wa" id="share">${t('share')}</button>
    <a class="btn ghost" id="save" download="snapmagic.jpg">${t('save')}</a>
    <p class="note">${t('hold')}</p>
    <button class="btn ghost" id="regen">${t('regen')}</button>
    <button class="btn ghost" id="same">${t('diff')}</button>
    <button class="btn ghost" id="again">${t('over')}</button></div>`;
    const show=src=>{cur=src;$('out').src=src;$('save').href=src};
    show(cur);
    $('share').onclick=()=>shareImage(cur);
    $('regen').onclick=()=>generate();
    if(wish)$('mkcard').onclick=async()=>{
      const name=$('cardname').value.trim();
      show(await addLabel(await makeCard(base,wish,name,isBday(st.opt)),true));
      $('mkcard').textContent=t('update');
    };
  }catch(e){
    s.innerHTML=`<div style="display:grid;gap:14px"><h1>${t('fail')}</h1><div class="err" id="msg"></div>
    <button class="btn" id="same">${t('tryAgain')}</button><button class="btn ghost" id="again">${t('over')}</button></div>`;
    $('msg').textContent=e.message;
  }
  $('again').onclick=()=>{Object.assign(st,{step:0,cat:null,opt:null,style:null,photo:null,photo2:null});render()};
  $('same').onclick=()=>{st.style=null;st.step=3;render()};
}
$('back').onclick=()=>{st.step=Math.max(0,st.step-1);render()};
$('lang').onclick=()=>{lang=lang==='hi'?'en':'hi';try{localStorage.setItem('sm_lang',lang)}catch(e){}if(st.step<4)render();else{ /* keep result on screen */ $('lang').textContent=t('langBtn');$('foot').textContent=t('foot');}};
render();
</script>
